<!DOCTYPE html>
<html>
<head>
    <title>FLow Fluent - A Pomodoro Timer </title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="top-left-controls">
        <a href="about.html" class="about-link">Flow Fluent</a>
        <a href='https://ko-fi.com/F1F4XSUQA' target='_blank'><img height='36' style='border:0px;height:36px;' src='https://storage.ko-fi.com/cdn/kofi4.png?v=3' border='0' alt='Buy Me a Coffee at ko-fi.com' /></a>
    </div>

    <div class="top-right-controls">
        <div id="current-date"></div>
    </div>

    <div class="container">
        <div class="pomodoro">
            <div id="timer-display">44:44</div>
            <button id="start-timer">Session</button>
            <button id="short-break">Short Break</button>
            <button id="long-break">Long Break</button>
            <button id="reset-timer" style="display:none;">Reset</button>
        </div>
    </div>

    <div class="bottom-left-controls">
        <div class="progress-container">
            <div class="session-progress">
                <span class="session-progress-label">Session Progress:</span>
                <span id="session-counter">0</span>
            </div>
            <div class="break-progress">
                <span class="break-progress-label">Short Breaks:</span>
                <span id="short-break-counter">0</span>
            </div>
            <div class="break-progress">
                <span class="break-progress-label">Long Breaks:</span>
                <span id="long-break-counter">0</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
